*{box-sizing:border-box}

.txt p,.txt h1{margin:0}
.t{animation:rise 1.2s var(--d,0s) ease-out both}

.names .n{font-family:"Pinyon Script","Snell Roundhand",cursive;font-size:12.92cqw;background:linear-gradient(180deg,#d9688a,#b0823a);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 0.83cqw}
.names .w{font-size:3.54cqw;font-style:italic;color:var(--gold)}
.full{font-size:2.60cqw;color:var(--soft);margin-top:0.42cqw!important}
.dv{display:flex;align-items:center;gap:1.67cqw;width:31.25cqw;margin:1.46cqw 0}
.dv::before,.dv::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.dv::after{transform:scaleX(-1)}
.dv i{width:1.46cqw;height:1.46cqw;background:var(--gold);transform:rotate(45deg)}
.day{font-size:4.17cqw;font-weight:600}
.time{font-size:3.54cqw;color:var(--rose);font-style:italic}
.venue{font-size:4.17cqw;font-weight:600;line-height:1.15;max-width:70.83cqw}
.addr{font-size:2.92cqw;color:var(--soft)}
.rs{font-size:4.17cqw;font-weight:600;color:var(--gold);margin-top:0.42cqw!important}
.rs i{font-weight:400;color:var(--ink);margin-right:1.25cqw}
.md{transform-box:fill-box;transform-origin:center;animation:spin 90s linear infinite}
#bride{animation:fromL 2.4s .5s ease-out both}
#groom{animation:fromR 2.4s .5s ease-out both}
.petals{position:absolute;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.petals span{position:absolute;top:-5%;left:var(--l);width:2.50cqw;height:3.33cqw;border-radius:50% 0 50% 50%;background:#f4b3c6;opacity:0;animation:fall var(--d) var(--t) linear infinite}
.petals span:nth-child(even){background:#fbd3de}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fromL{0%{opacity:0;transform:translateX(-260px)}25%{opacity:1}100%{opacity:1;transform:none}}
@keyframes fromR{0%{opacity:0;transform:translateX(260px)}25%{opacity:1}100%{opacity:1;transform:none}}
@keyframes fall{0%{top:-4%;opacity:0;transform:translateX(0) rotate(0)}8%{opacity:.9}50%{transform:translateX(5cqw) rotate(200deg)}92%{opacity:.9}100%{top:102%;opacity:0;transform:translateX(-3cqw) rotate(380deg)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}.petals{display:none}}
